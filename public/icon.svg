    <line x1="96" y1="184" x2="142" y2="184" />
    <line x1="96" y1="256" x2="142" y2="256" />
    <line x1="96" y1="328" x2="142" y2="328" />
    <line x1="370" y1="184" x2="416" y2="184" />
    <line x1="370" y1="256" x2="416" y2="256" />
    <line x1="370" y1="328" x2="416" y2="328" />
