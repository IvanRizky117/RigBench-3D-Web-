  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="url(#glow)" />
  <rect x="20" y="20" width="472" height="472" rx="96" stroke="#3B82F6" stroke-opacity="0.28" stroke-width="4" />

